<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول | cyberScan</title>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-body">

  <div class="login-wrapper">
    <!-- صندوق تسجيل الدخول -->
    <section class="login-card">
      <div class="login-header">
        <div class="login-logo">
          <i class="fas fa-shield-alt"></i>
          <span>cyber<span>Scan</span></span>
        </div>
        <h1>تسجيل الدخول</h1>
        <p>سجّل دخولك للوصول إلى أدواتك وسجل الفحوصات ولوحة التحكم.</p>
      </div>

      <form class="login-form" id="loginForm">
        <div class="form-group">
          <label for="email">البريد الإلكتروني</label>
          <div class="input-wrapper">
            <i class="fas fa-envelope"></i>
            <input type="email" id="email" name="email" placeholder="example@mail.com" required />
          </div>
        </div>

        <div class="form-group">
          <label for="password">كلمة المرور</label>
          <div class="input-wrapper">
            <i class="fas fa-lock"></i>
            <input type="password" id="password" name="password" placeholder="••••••••" required />
            <button type="button" class="toggle-password" aria-label="إظهار / إخفاء كلمة المرور">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="form-meta">
          <label class="remember-me">
            <input type="checkbox" id="remember" />
            <span>تذكرني على هذا الجهاز</span>
          </label>
          <a href="#" class="forgot-link">نسيت كلمة المرور؟</a>
        </div>

        <button type="submit" class="btn-login-submit">تسجيل الدخول</button>
      </form>

      <div class="login-footer">
        <p>لا تملك حساباً بعد؟ <span class="muted">سيتم إضافة التسجيل قريباً.</span></p>
        <a href="index.html" class="back-home">
          <i class="fas fa-arrow-right"></i> العودة إلى الصفحة الرئيسية
        </a>
      </div>
    </section>
  </div>

  <script src="login.js"></script>
</body>
</html>
